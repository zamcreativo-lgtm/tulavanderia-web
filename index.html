document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

,255,.1), transparent 50%), linear-gradient(160deg, #235BAA, #0D2E63)\">\n    <div style=\"width: 400px; background: #FFFBF6; border-radius: 24px; padding: 44px 38px; display: flex; flex-direction: column; gap: 14px; text-align: center; align-items: center; box-shadow: 0 40px 80px -30px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.03)\">\n      <div style=\"width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; background: linear-gradient(150deg, #5B9BFF, #1B3E9C); box-shadow: 0 10px 24px -8px rgba(14,124,134,.4)\">🔒<\u002Fdiv>\n      <span style=\"font-size: 16px; font-weight: 800; color: #231B12\">Suscripción {{ licenciaEstadoTxt }}<\u002Fspan>\n      <span style=\"font-size: 13px; color: #6B7378; line-height: 1.5\">Tu cuenta ({{ authEmailSesion }}) todavía no tiene una suscripción activa.<\u002Fspan>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%\">\n        <sc-for list=\"{{ planes }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ p.elegir }}\" style=\"{{ p.style }}\">\n            <span style=\"font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; color: #14181B\">{{ p.label }}<\u002Fspan>\n            <span style=\"font-size: 15px; font-weight: 800; color: #14181B\">${{ p.precio }}<\u002Fspan>\n            <span style=\"font-size: 10px; color: #6B7378\">{{ p.sufijo }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <a href=\"{{ stripeLink }}\" target=\"_blank\" rel=\"noopener\" style=\"width: 100%; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 12.5px; font-weight: 800; letter-spacing: 0.05em; color: #fff; text-decoration: none; background: #0E7C86\">PAGAR / RENOVAR SUSCRIPCIÓN<\u002Fa>\n      <button sc-camel-on-click=\"{{ revisarLicencia }}\" style=\"width: 100%; height: 40px; border: 1px solid #DCE1E4; background: #fff; border-radius: 8px; font-size: 12.5px; font-weight: 700; color: #4A5257; cursor: pointer\">YA PAGUÉ, VERIFICAR DE NUEVO<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ cerrarSesion }}\" style=\"width: 100%; height: 40px; border: 1px solid #DCE1E4; background: #fff; border-radius: 8px; font-size: 12.5px; font-weight: 700; color: #4A5257; cursor: pointer\">CERRAR SESIÓN<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ mostrarGate }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"min-height: 100vh; display: grid; place-items: center; font-family: Archivo, system-ui, sans-serif; background: radial-gradient(circle at 20% 15%, rgba(255,255,255,.3), transparent 45%), radial-gradient(circle at 85% 10%, rgba(255,255,255,.15), transparent 40%), radial-gradient(circle at 70% 90%, rgba(255,255,255,.1), transparent 50%), linear-gradient(160deg, #235BAA, #0D2E63)\">\n    <div style=\"width: 380px; background: #fff; border-radius: 10px; padding: 36px 34px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08)\">\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 12px\">\n        <div style=\"width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(150deg, #5B9BFF, #1B3E9C); box-shadow: 0 10px 24px -8px rgba(14,124,134,.4)\">\n          <img src=\"992e156a-5c79-41cc-88d3-c386ee807bb0\" alt=\"Lavadora\" style=\"width: 62px; height: 62px; object-fit: contain; filter: brightness(0) invert(1)\">\n        <\u002Fdiv>\n        <span style=\"font-size: 15px; font-weight: 800; letter-spacing: 0.04em; color: #14181B\">{{ negocio }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ gateEsMostrador }}\" hint-placeholder-val=\"{{ true }}\">\n        <span style=\"font-size: 13px; color: #6B7378; line-height: 1.5; text-align: center\">Selecciona tu usuario y escribe tu PIN.<\u002Fspan>\n        <label style=\"display: flex; flex-direction: column; gap: 6px\">\n          <span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.12em; color: #6B7378\">USUARIO<\u002Fspan>\n          <div style=\"position: relative\">\n            <sc-raw-select value=\"{{ gateUsuario }}\" sc-camel-on-change=\"{{ setGateUsuario }}\" style=\"appearance: none; width: 100%; height: 48px; border: 1px solid #D7DCE1; border-radius: 8px; padding: 0 16px; font-size: 14px; font-weight: 600; outline: none; background: #fff; color: #14181B\">\n              <sc-for list=\"{{ mostradoresSel }}\" as=\"m\" hint-placeholder-count=\"1\">\n                <option value=\"{{ m.val }}\">{{ m.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n            <span style=\"position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 10px; color: #6B7378; pointer-events: none\">▾<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Flabel>\n        <label style=\"display: flex; flex-direction: column; gap: 6px\">\n          <span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.12em; color: #6B7378\">PIN<\u002Fspan>\n          <input type=\"password\" inputmode=\"numeric\" sc-camel-max-length=\"6\" value=\"{{ gatePin }}\" sc-camel-on-change=\"{{ setGatePin }}\" sc-camel-on-key-down=\"{{ onEnterMostrador }}\" sc-camel-auto-focus=\"{{ true }}\" style=\"height: 48px; border: 1px solid #D7DCE1; border-radius: 8px; padding: 0 12px; font-size: 20px; letter-spacing: 0.35em; text-align: center; outline: none; background: #fff; color: #14181B\">\n        <\u002Flabel>\n        <sc-if value=\"{{ gateErr }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background: #FBEEEC; border: 1px solid #F0D2CD; border-radius: 8px; padding: 10px 13px; font-size: 12px; font-weight: 700; color: #A9403A\">{{ gateErr }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ gateEntrarMostrador }}\" style=\"height: 50px; border: none; border-radius: 8px; font-size: rHoraTicket }}\" sc-camel-on-change=\"{{ toggleMostrarHora }}\">\n              Mostrar la hora de recibido en el ticket\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ imprimir }}\" title=\"{{ tipTicketImprimir }}\" style=\"height: 46px; border: none; border-radius: 10px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #fff; cursor: pointer; background: {{ accent }}\">🖨 IMPRIMIR TICKET<\u002Fbutton>\n            <span style=\"font-size: 11px; color: #8A9298; line-height: 1.45\">En el diálogo elige tu impresora térmica, papel {{ papelTxt }} y márgenes en Ninguno.<\u002Fspan>\n            <button sc-camel-on-click=\"{{ descargarImagen }}\" style=\"height: 42px; border: 1px solid #DCE1E4; background: #fff; border-radius: 9px; font-size: 12.5px; font-weight: 700; color: #4A5257; cursor: pointer\">🖼 Descargar ticket como imagen<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ enviarWa }}\" title=\"{{ tipTicketWa }}\" style=\"height: 42px; border: 1px solid #DCE1E4; background: #fff; border-radius: 9px; font-size: 12.5px; font-weight: 700; color: #4A5257; cursor: pointer\">💬 Enviar nota por WhatsApp<\u002Fbutton>\n            <span style=\"font-size: 11px; color: #8A9298; line-height: 1.45\">{{ waNota }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ volverMostrador }}\" style=\"height: 38px; border: none; background: none; font-size: 12.5px; font-weight: 700; color: #6B7378; cursor: pointer\">← Volver al mostrador<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ esPreview }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background: #FDF3DC; border: 1px solid #F0DFB0; border-radius: 10px; padding: 12px 15px; font-size: 12.5px; font-weight: 600; color: #8A6A1F; line-height: 1.45\">Vista previa: esta nota todavía no se guarda. Vuelve a la captura y usa Guardar y ver ticket.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ waEnviado }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background: #E6F2F3; border: 1px solid #B9DBDE; border-radius: 10px; padding: 12px 15px; display: flex; flex-direction: column; gap: 9px\">\n              <span style=\"font-size: 12.5px; font-weight: 700; color: #0B6570\">WhatsApp abierto para {{ waDestino }}<\u002Fspan>\n              <sc-if value=\"{{ waBloqueado }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"font-size: 11.5px; color: #0B6570; line-height: 1.45\">El navegador bloqueó la ventana. Abre el chat con este botón:<\u002Fspan>\n              <\u002Fsc-if>\n              <a href=\"{{ waUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"display: block; text-align: center; height: 38px; line-height: 38px; border-radius: 8px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.06em; color: #fff; background: #0B6570; text-decoration: none\">ABRIR CHAT DE WHATSAPP<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ esClientes }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding: 24px 30px 40px; display: flex; flex-direction: column; gap: 16px\">\n\n        <div style=\"background: #fff; border: 1px solid #DCE1E4; border-radius: 12px; padding: 16px 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap\">\n          <div style=\"display: flex; flex-direction: column; gap: 3px\">\n            <span title=\"{{ tipClientesDirectorio }}\" style=\"font-size: 16px; font-weight: 800\">Directorio de clientes<\u002Fspan>\n            <span style=\"font-size: 12px; color: #6B7378\">{{ notaDirectorio }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap\">\n            <button sc-camel-on-click=\"{{ toggleAlta }}\" title=\"{{ tipClientesAlta }}\" style=\"height: 40px; padding: 0 16px; border: none; border-radius: 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #fff; cursor: pointer; background: {{ accent }}\">{{ altaLabel }}<\u002Fbutton>\n            <span style=\"font-size: 15px\">{{ iconoCandado }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ descargarClientes }}\" disabled=\"{{ bloqueado }}\" style=\"{{ descargaBtnStyle }}\">DESCARGAR CLIENTES<\u002Fbutton>\n            <label style=\"{{ cargaLabelStyle }}\">CARGAR CLIENTES\n              <input type=\"file\" accept=\"application/json,text/csv,.csv,.json\" sc-camel-on-change=\"{{ cargarClientes }}\" disabled=\"{{ bloqueado }}\" style=\"display: none\">\n            <\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"{{ altaStyle }}\">\n          <span style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: {{ accent }}\">ALTA DE CLIENTE<\u002Fspan>\n          <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px\">\n            <label style=\"display: flex; flex-direction: column; gap: 5px; min-width: 0\">\n              <span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.12em; color: #6B7378\">NOMBRE<\u002Fspan>\n              <input value=\"{{ ncNombre }}\" sc-camel-on-change=\"{{ setNcNombre }}\" style=\"height: 42px; border: 1px solid #DCE1E4; border-radius: 8px; padding: 0 12px; font-size: 14px; font-weight: 600; text-transform: uppercase; outline: none; background: #FBFCFC; width: 100%; min-width: 0\">\n            <\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 5px; min-width: 0\">\n              <span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.12em; color: #6B7378\">TELÉFONO<\u002Fspan>\n              <input value=\"{{ ncTel }}\" sc-camel-on-change=\"{{ setNcTel }}\" style=\"height: 42px; border: 1px solid #DCE1E4; border-radius: 8px; padding: 0 12px; font-size: 14px; font-family: 'Roboto Mono', monospace; outline: none; background: #FBFCFC; width: 100% ze: 12px; font-weight: 700; color: #6B7378; cursor: pointer\">Cancelar<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background: #fff; border: 1px solid #DCE1E4; border-radius: 12px; overflow: hidden\">\n          <div style=\"display: grid; grid-template-columns: minmax(200px, 1.2fr) 118px minmax(160px, 1fr) 70px 86px 264px; gap: 10px; padding: 11px 20px; background: #F4F6F7; border-bottom: 1px solid #DCE1E4; font-size: 9.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #6B7378\">\n            <div title=\"{{ tipClientesTabla }}\">Cliente<\u002Fdiv><div>Teléfono<\u002Fdiv><div>Dirección<\u002Fdiv><div>Notas<\u002Fdiv><div>Gasto<\u002Fdiv><div><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ clientesUI }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div style=\"display: grid; grid-template-columns: minmax(200px, 1.2fr) 118px minmax(160px, 1fr) 70px 86px 264px; gap: 10px; padding: 12px 20px; border-bottom: 1px solid #EEF1F2; align-items: center\">\n              <div style=\"display: flex; align-items: center; gap: 11px; min-width: 0\">\n                <div style=\"width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex-shrink: 0; color: #fff; background: {{ accent }}\">{{ c.ini }}<\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 1px; min-width: 0\">\n                  <div style=\"font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ c.nombre }}<\u002Fdiv>\n                  <div style=\"font-size: 11px; color: #6B7378; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ c.mail }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; color: #4A5257\">{{ c.tel }}<\u002Fdiv>\n              <div style=\"font-size: 12px; color: #4A5257; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ c.dir }}<\u002Fdiv>\n              <div style=\"font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: 700\">{{ c.notas }}<\u002Fdiv>\n              <div style=\"font-family: 'Roboto Mono', monospace; font-size: 13px; font-weight: 700\">{{ c.gastoTxt }}<\u002Fdiv>\n              <div style=\"display: flex; gap: 5px\">\n                <button sc-camel-on-click=\"{{ c.usar }}\" style=\"height: 30px; padding: 0 8px; border: none; border-radius: 6px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.02em; color: #fff; cursor: pointer; background: {{ accent }}; white-space: nowrap\">NUEVA NOTA<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ c.editar }}\" title=\"Corregir datos\" style=\"height: 30px; padding: 0 8px; border: 1px solid #DCE1E4; border-radius: 6px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.02em; color: #4A5257; background: #fff; cursor: pointer; white-space: nowrap\">EDITAR<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ c.borrar }}\" disabled=\"{{ c.borrarDisabled }}\" title=\"{{ c.borrarTitle }}\" style=\"height: 30px; padding: 0 8px; border: 1px solid #DCE1E4; border-radius: 6px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.02em; color: #A9403A; background: #fff; cursor: pointer; white-space: nowrap\">BORRAR<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ sinClientes }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding: 40px 20px; text-align: center; font-size: 13px; color: #6B7378\">{{ vacioClientes }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ esPrecios }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding: 24px 30px 40px; display: grid; grid-template-columns: minmax(620px, 1fr) 400px; gap: 20px; align-items: start\">\n\n        <div style=\"display: flex; flex-direction: column; gap: 16px\">\n          <div style=\"background: #fff; border: 1px solid #DCE1E4; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n              <span title=\"{{ tipPreciosLista }}\" style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: #6B7378\">LISTA DE PRECIOS · {{ sucursal }}<\u002Fspan>\n              <span style=\"{{ rolChipStyle }}\">{{ userRole }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size: 12px; color: #6B7378; line-height: 1.5\">Una línea por servicio: <b>CLAVE | Servicio | Precio<\u002Fb>. La clave y el precio se usan solos en la captura y en el ticket.<\u002Fspan>\n            <textarea value=\"{{ catTexto }}\" sc-camel-on-change=\"{{ setCatTexto }}\" disabled=\"{{ noEdita }}\" style=\"min-height: 380px; border: 1px solid #DCE1E4; border-radius: 8px; padding: 12px; font-family: 'Roboto Mono', monospace; font-size: 12.5px; line-height: 1.6; outline: none; resize: vertical; background: #FBFCFC\"><\u002Ftextarea>\n            <sc-if value=\"{{ puedeEditar }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display: flex; gap: 8px; align-items: center\">\n                <button sc-camel-on-click=\"{{ guardarCatalogo }}\" style=\"height: 42px; padding: 0 18px; border: none; border-radius: 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #fff; cursor: pointer; background: {{ accent }}\">GUARDAR PRECIOS<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ restaurarCatalogo }}\" style=\"height: 42px; padding: 0 18px; border: 1px solid #DCE1E4; background: #fff; border-radius: 8px; font-size: 12px; font-weight: 700; color: #4A5257; cursor: pointer\">Restaurar lista original<\u002Fbutton>\n                <span style=\"font-size: 12px; color: #6B7378; font-weight: 600\">{{ catEstado }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ bloqueado }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"background: #FBEEEC; border: 1px solid #F0D2CD; border-radius: 8px; padding: 12px 14px; display: flex; align-items: center; gap: 12px\">\n                <span style=\"font-size: 16px\">🔒<\u002Fspan>\n                <span style=\"font-size: 12.5px; font-weight: 600; color: #7A2B26; flex: 1; line-height: 1.45\">Los precios están protegidos. Solo el gerente puede editarlos: desbloquea con la contraseña en la tarjeta Seguridad.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 16px\">\n          <div style=\"{{ seguridadStyle }}\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px\">\n              <span title=\"{{ tipPreciosSeguridad }}\" style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: #6B7378\">SEGURIDAD Y ACCESO DE GERENTE<\u002Fspan>\n              <span style=\"{{ rolChipStyle }}\">{{ candado }}<\u002Fspan>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ pwCerrado }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 10px\">\n                <span style=\"font-size: 12px; color: #6B7378; line-height: 1.5\">El modo gerente usa la contraseña de tu cuenta ({{ authEmailApp }}) — la misma con la que iniciaste sesión.<\u002Fspan>\n                <input type=\"password\" value=\"{{ pwIn }}\" sc-camel-on-change=\"{{ setPwIn }}\" placeholder=\"Contraseña de tu cuenta\" style=\"height: 42px; border: 1px solid #DCE1E4; border-radius: 8px; padding: 0 12px; font-size: 14px; outline: none; background: #FBFCFC\">\n                <button sc-camel-on-click=\"{{ desbloquear }}\" style=\"height: 42px; border: none; border-radius: 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #fff; cursor: pointer; background: #14181B\">DESBLOQUEAR<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ pwAbierto }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 10px\">\n                <span style=\"font-size: 12px; color: #0B6570; font-weight: 600; line-height: 1.5\">Modo gerente activo. Bloquea al terminar para volver a la vista de Mostrador.<\u002Fspan>\n                <button sc-camel-on-click=\"{{ bloquear }}\" style=\"height: 40px; border: none; border-radius: 8px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.06em; color: #fff; cursor: pointer; background: #14181B\">BLOQUEAR<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ pwErr }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"background: #FBEEEC; border: 1px solid #F0D2CD; border-radius: 8px; padding: 10px 13px; font-size: 12px; font-weight: 700; color: #A9403A\">{{ pwErr }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"background: #fff; border: 1px solid #DCE1E4; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 13px\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px\">\n              <span style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: #6B7378\">DATOS DE LA LAVANDERÍA<\u002Fspan>\n              <span style=\"font-size: 15px\">{{ iconoCandado }}<\u002Fspan>\n            <\u002Fdiv>\n            <label style=\"display: flex; flex-direction: column; gap: 5px\">\n              <span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.12em; color: #6B7378\">NOMBRE DEL NEGOCIO<\u002Fspan>\n              <div style=\"display: flex; gap: 8px\">\n            <\u002Flabel>\n\n            <div style=\"display: flex; flex-direction: column; gap: 9px; border-top: 1px solid #EEF1F2; padding-top: 12px\">\n              <span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.12em; color: #6B7378\">LOGO DEL TICKET<\u002Fspan>\n              <div style=\"{{ logoPreviewStyle }}\">\n                <sc-if value=\"{{ hayLogo }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div role=\"img\" aria-label=\"Logo\" ref=\"{{ logoMiniRef }}\" style=\"{{ logoMiniStyle }}\"><\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ noLogo }}\" hint-placeholder-val=\"{{ true }}\">\n                  <span style=\"font-size: 11.5px; color: #8A9298; font-weight: 600\">Sin logo<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 8px\">\n                <label style=\"{{ subirLogoStyle }}\">SUBIR PNG O JPG\n                  <input type=\"file\" accept=\"image/png,image/jpeg\" sc-camel-on-change=\"{{ cargarLogo }}\" disabled=\"{{ bloqueado }}\" style=\"display: none\">\n                <\u002Flabel>\n                <sc-if value=\"{{ hayLogo }}\" hint-placeholder-val=\"{{ true }}\">\n                  <button sc-camel-on-click=\"{{ quitarLogo }}\" disabled=\"{{ bloqueado }}\" style=\"height: 38px; padding: 0 13px; border: 1px solid #DCE1E4; background: #fff; border-radius: 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; color: #A9403A; cursor: pointer\">QUITAR<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <label style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px\">\n                <span style=\"font-size: 11.5px; color: #6B7378; font-weight: 600\">Ancho impreso (mm)<\u002Fspan>\n                <input value=\"{{ logoAncho }}\" sc-camel-on-change=\"{{ setLogoAncho }}\" disabled=\"{{ bloqueado }}\" style=\"width: 72px; height: 36px; border: 1px solid #DCE1E4; border-radius: 8px; padding: 0 10px; font-size: 14px; font-family: 'Roboto Mono', monospace; font-weight: 700; text-align: right; outline: none; background: #FBFCFC\">\n              <\u002Flabel>\n              <span style=\"font-size: 11px; color: #8A9298; line-height: 1.45\">{{ logoEstado }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ sucCampos }}\" as=\"f\" hint-placeholder-count=\"3\">\n              <label style=\"display: flex; flex-direction: column; gap: 5px\">\n                <span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.12em; color: #6B7378\">{{ f.label }}<\u002Fspan>\n                <input value=\"{{ f.valor }}\" sc-camel-on-change=\"{{ f.set }}\" disabled=\"{{ f.disabled }}\" style=\"height: 40px; border: 1px solid #DCE1E4; border-radius: 8px; padding: 0 11px; font-size: 13.5px; outline: none; background: #FBFCFC\">\n                <span style=\"font-size: 11px; color: #8A9298\">{{ f.hint }}<\u002Fspan>\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background: #fff; border: 1px solid #DCE1E4; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 13px\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px\">\n              <span title=\"{{ tipPreciosUsuarios }}\" style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: #6B7378\">USUARIOS<\u002Fspan>\n              <span style=\"font-size: 15px\">{{ iconoCandado }}<\u002Fspan>\n            <\u002Fdiv>\n            <label style=\"display: flex; flex-direction: column; gap: 5px\">\n              <span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.12em; color: #6B7378\">GERENTE · MODO ADMINISTRADOR<\u002Fspan>\n              <input value=\"{{ gerenteVal }}\" sc-camel-on-change=\"{{ setGerente }}\" disabled=\"{{ bloqueado }}\" style=\"height: 40px; border: 1px solid #DCE1E4; border-radius: 8px; padding: 0 11px; font-size: 14px; font-weight: 600; text-transform: uppercase; outline: none; background: #FBFCFC\">\n            <\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 5px; border-top: 1px solid #EEF1F2; padding-top: 12px\">\n              <span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.12em; color: #6B7378\">CAMBIAR CONTRASEÑA · HASTA 6 CARACTERES<\u002Fspan>\n              <div style=\"display: flex; gap: 8px\">\n                <input value=\"{{ nuevaPassVal }}\" sc-camel-on-change=\"{{ setNuevaPass }}\" disabled=\"{{ bloqueado }}\" maxlength=\"6\" placeholder=\"Ej. AB12CD\" style=\"flex: 1; height: 40px; border: 1px solid #DCE1E4; border-radius: 8px; padding: 0 11px; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; outline: none; background: #FBFCFC\">\n                <button sc-camel-on-click=\"{{ guardarNuevaPass }}\" disabled=\"{{ bloqueado }}\" style=\"height: 40px; padding: 0 16px; border: none; border-radius: 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #fff; cursor: pointer; background: {{ accent }}\">GUARDAR<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{ nuevaPassMsg }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size: 11.5px; font-weight: 700; color: {{ nuevaPassMsgColor }}\">{{ nuevaPassMsg }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Flabel>\n            <div style=\"display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #EEF1F2; padding-top: 12px\">\n              <span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.12em; color: #6B7378\">MOSTRADOR · PIN DE 6 DÍGITOS POR USUARIO<\u002Fspan>\n              <sc-for list=\"{{ mostradoresUI }}\" as=\"m\" hint-placeholder-count=\"2\">\n                <div style=\"display: flex; flex-direction: column; gap: 6px; border: 1px solid #EEF1F2; border-radius: 8px; padding: 10px\">\n                  <div style=\"display: flex; gap: 8px\">\n                    <input value=\"{{ m.nombre }}\" sc-camel-on-change=\"{{ m.rename }}\" disabled=\"{{ m.disabled }}\" style=\"flex: 1; height: 40px; border: 1px solid #DCE1E4; border-radius: 8px; padding: 0 11px; font-size: 13.5px; font-weight: 600; text-transform: uppercase; outline: none; background: #FBFCFC\">\n                    <button sc-camel-on-click=\"{{ m.remove }}\" disabled=\"{{ m.removeDisabled }}\" style=\"height: 40px; padding: 0 12px; border: 1px solid #DCE1E4; background: #fff; border-radius: 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; color: #A9403A; cursor: pointer\">QUITAR<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"display: flex; gap: 8px; align-items: center\">\n                    <input type=\"password\" inputmode=\"numeric\" sc-camel-max-length=\"6\" value=\"{{ m.pinIn }}\" sc-camel-on-change=\"{{ m.setPin }}\" disabled=\"{{ m.disabled }}\" placeholder=\"PIN nuevo (6 dígitos)\" style=\"flex: 1; height: 38px; border: 1px solid #DCE1E4; border-radius: 8px; padding: 0 11px; font-size: 13px; letter-spacing: 0.15em; outline: none; background: #FBFCFC\">\n                    <button sc-camel-on-click=\"{{ m.guardarPin }}\" disabled=\"{{ m.disabled }}\" style=\"height: 38px; padding: 0 14px; border: none; border-radius: 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; color: #fff; cursor: pointer; background: {{ accent }}\">GUARDAR<\u002Fbutton>\n                  <\u002Fdiv>\n                  <span style=\"font-size: 10.5px; color: #8A9298; font-weight: 600\">{{ m.pinEstado }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display: flex; gap: 8px\">\n                <input value=\"{{ nuevoMostradorVal }}\" sc-camel-on-change=\"{{ setNuevoMostrador }}\" disabled=\"{{ bloqueado }}\" placeholder=\"NUEVO USUARIO\" style=\"flex: 1; height: 40px; border: 1px solid #DCE1E4; border-radius: 8px; padding: 0 11px; font-size: 13.5px; text-transform: uppercase; outline: none; background: #FBFCFC\">\n                <button sc-camel-on-click=\"{{ agregarMostrador }}\" disabled=\"{{ bloqueado }}\" style=\"height: 40px; padding: 0 16px; border: none; border-radius: 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #fff; cursor: pointer; background: {{ accent }}\">AGREGAR<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background: #fff; border: 1px solid #DCE1E4; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 11px\">\n            <span title=\"{{ tipPreciosRespaldo }}\" style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: #6B7378\">RESPALDO<\u002Fspan>\n            <span style=\"font-size: 12px; color: #6B7378; line-height: 1.5\">Descarga un archivo con clientes, notas, precios y folio. Si formateas el equipo o cambias de navegador, lo recuperas con Cargar.<\u002Fspan>\n            <button sc-camel-on-click=\"{{ descargarRespaldo }}\" style=\"height: 42px; border: none; border-radius: 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #fff; cursor: pointer; background: #14181B\">DESCARGAR RESPALDO<\u002Fbutton>\n            <label style=\"height: 42px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #0E7C86; background: #E6F2F3; cursor: pointer\">CARGAR RESPALDO\n              <input type=\"file\" accept=\"application/json\" sc-camel-on-change=\"{{ cargarRespaldo }}\" style=\"display: none\">\n            <\u002Flabel>\n            <span style=\"font-size: 11.5px; color: #6B7378\">{{ estadoRespaldo }}<\u002Fspan>\n            <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap\">\n              <span style=\"font-size: 11.5px; font-weigh
