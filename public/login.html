  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

er\">Limpiar captura<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"background: #fff; border: 1px solid #DCE1E4; border-radius: 12px; padding: 15px 17px; display: flex; gap: 11px; align-items: flex-start\">\n            <span style=\"font-size: 16px\">💬<\u002Fspan>\n            <div style=\"font-size: 12.5px; color: #4A5257; line-height: 1.5; font-weight: 500\">Al marcar la nota como <b>Lista<\u002Fb> se avisa por WhatsApp al {{ dTelAviso }}.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ esTicket }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"{{ ticketGridStyle }}\">\n\n        <div id=\"stage\" style=\"{{ stageStyle }}\">\n          <div id=\"print\" style=\"{{ paperStyle }}\">\n            <sc-for list=\"{{ talones }}\" as=\"t\" hint-placeholder-count=\"1\">\n              <div style=\"{{ t.wrapStyle }}\">\n                <div style=\"text-align: center; display: flex; flex-direction: column; gap: 0.6mm\">\n                  <span style=\"font-size: 1.6em; font-weight: {{ t1Weight }}; letter-spacing: 0.08em; line-height: 1.15\">{{ negocio }}<\u002Fspan>\n                  <sc-if value=\"{{ hayTitulo2 }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"font-size: 1.15em; font-weight: {{ t2Weight }}; letter-spacing: 0.06em; line-height: 1.15\">{{ titulo2 }}<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ haySubtitulo }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span style=\"font-size: 0.9em; font-weight: {{ subWeight }}; line-height: 1.2\">{{ subtitulo }}<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ hayLogo }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div role=\"img\" aria-label=\"Logo\" ref=\"{{ logoPrintRef }}\" style=\"{{ logoStyle }}\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <span style=\"font-size: 0.88em; font-weight: 600; line-height: 1.35\">{{ direccion }}<\u002Fspan>\n                  <span style=\"font-size: 0.88em; font-weight: 600; line-height: 1.35\">{{ colonia }}<\u002Fspan>\n                  <span style=\"font-size: 0.96em; font-weight: 800\">WhatsApp {{ telefono }}<\u002Fspan>\n                  <span style=\"font-size: 0.82em; font-weight: 800; letter-spacing: 0.18em; color: #fff; background: #14181B; padding: 1.1mm 0; margin-top: 1mm\">{{ t.badge }}<\u002Fspan>\n                <\u002Fdiv>\n\n                <div style=\"border-top: 1px dashed #14181B; border-bottom: 1px dashed #14181B; padding: 2mm 0; display: flex; align-items: center; justify-content: space-between\">\n                  <span style=\"font-size: 0.88em; font-weight: 800; letter-spacing: 0.12em\">NOTA<\u002Fspan>\n                  <span style=\"font-size: 1.75em; font-weight: 800; line-height: 1; font-family: ui-monospace, 'SF Mono', Consolas, monospace\">{{ tFolio }}<\u002Fspan>\n                <\u002Fdiv>\n\n                <div style=\"display: flex; flex-direction: column; gap: 1.1mm; line-height: 1.4\">\n                  <span><b>Cliente:<\u002Fb> {{ tCliente }}<\u002Fspan>\n                  <span><b>Tel:<\u002Fb> {{ tTel }}<\u002Fspan>\n                  <span><b>Etiqueta:<\u002Fb> {{ tEtiqueta }} &nbsp; <b>Suc:<\u002Fb> {{ tSucursal }}<\u002Fspan>\n                  <span><b>Atendió:<\u002Fb> {{ tAtendio }}<\u002Fspan>\n                  <span><b>Recibido:<\u002Fb> {{ tRecibo }}<\u002Fspan>\n                  <span><b>Entrega:<\u002Fb> {{ tEntrega }}<\u002Fspan>\n                  <span><b>Kg:<\u002Fb> {{ tKg }} &nbsp; <b>Prendas:<\u002Fb> {{ tPrendas }}<\u002Fspan>\n                <\u002Fdiv>\n\n                <div style=\"border-top: 1px dashed #14181B; padding-top: 2mm; display: flex; flex-direction: column; gap: 2.2mm\">\n                  <sc-for list=\"{{ tLineas }}\" as=\"l\" hint-placeholder-count=\"2\">\n                    <div style=\"display: flex; flex-direction: column\">\n                      <div style=\"display: flex; justify-content: space-between; gap: 2mm; font-weight: 700; line-height: 1.3\">\n                        <span>{{ l.titulo }}<\u002Fspan>\n                        <span>{{ l.importe }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <span style=\"font-size: 0.8em; line-height: 1.3\">{{ l.detalle }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <div style=\"border-top: 1px dashed #14181B; padding-top: 2mm; display: flex; flex-direction: column; gap: 1.2mm\">\n                  <div style=\"display: flex; justify-content: space-between\"><span>Subtotal<\u002Fspan><span>{{ tSubtotal }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"{{ tIvaStyle }}\"><span>IVA 16%<\u002Fspan><span>{{ tIva }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display: flex; justify-content: space-between; font-size: 1.35em; font-weight: 800; border-top: 1px solid #14181B; border-bottom: 1px solid #14181B; padding: 1.4mm 0; margin: 1.2mm 0\"><span>TOTAL<\u002Fspan><span>{{ tTotal }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display: flex; justify-content: space-between\"><span>Anticipo {{ tPago }}<\u002Fspan><span>{{ tAnticipo }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display: flex; justify-content: space-between; font-size: 1.2em; font-weight: 800\"><span>SALDO<\u002Fspan><span>{{ tSaldo }}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display: flex; flex-direction: column; gap: 1mm; line-height: 1.35; border-top: 1px dashed #14181B; padding-top: 2mm\">\n                  <span style=\"font-weight: 800; letter-spacing: 0.06em; font-size: 0.88em\">OBSERVACIONES<\u002Fspan>\n                  <span style=\"font-size: 0.88em\">{{ tObs }}<\u002Fspan>\n                <\u002Fdiv>\n\n                <div style=\"border-top: 1px dashed #14181B; padding-top: 2mm\">\n                  <span style=\"display: block; font-size: 0.7em; line-height: 1.4; text-align: justify\">{{ legal }}<\u002Fspan>\n                <\u002Fdiv>\n\n                <span style=\"font-size: 0.88em; font-weight: 700; text-align: center; letter-spacing: 0.06em; padding-top: 1.5mm\">{{ t.pie }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"no-print\" style=\"position: sticky; top: 96px; display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"background: #fff; border: 1px solid #DCE1E4; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n            <div title=\"{{ tipTicketFormato }}\" style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: #6B7378\">FORMATO DE IMPRESIÓN<\u002Fdiv>\n            <sc-raw-select value=\"{{ ticketFmt }}\" sc-camel-on-change=\"{{ setTicketFmt }}\" style=\"height: 44px; border: 1px solid #DCE1E4; border-radius: 8px; padding: 0 11px; font-size: 13.5px; font-weight: 700; outline: none; background: #FBFCFC; color: #14181B\">\n              <sc-for list=\"{{ formatos }}\" as=\"f\" hint-placeholder-count=\"3\">\n                <option value=\"{{ f.key }}\">{{ f.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n            <label style=\"display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: #4A5257; cursor: pointer\">\n              <input type=\"checkbox\" checked=\"{{ mostrarHoraTicket }}\" sc-camel-on-change=\"{{ toggleMostrarHora }}\">\n              Mostrar la hora de recibido en el ticket\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ imprimir }}\" title=\"{{ tipTicketImprimir }}\" style=\"height: 46px; border: none; border-radius: 10px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #fff; cursor: pointer; background: {{ accent }}\">🖨 IMPRIMIR TICKET<\u002Fbutton>\n            <span style=\"font-size: 11px; color: #8A9298; line-height: 1.45\">En el diálogo elige tu impresora térmica, papel {{ papelTxt }} y márgenes en Ninguno.<\u002Fspan>\n            <button sc-camel-on-click=\"{{ descargarImagen }}\" style=\"height: 42px; border: 1px solid #DCE1E4; background: #fff; border-radius: 9px; font-size: 12.5px; font-weight: 700; color: #4A5257; cursor: pointer\">🖼 Descargar ticket como imagen<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ enviarWa }}\" title=\"{{ tipTicketWa }}\" style=\"height: 42px; border: 1px solid #DCE1E4; background: #fff; border-radius: 9px; font-size: 12.5px; font-weight: 700; color: #4A5257; cursor: pointer\">💬 Enviar nota por WhatsApp<\u002Fbutton>\n            <span style=\"font-size: 11px; color: #8A9298; line-height: 1.45\">{{ waNota }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ volverMostrador }}\" style=\"height: 38px; border: none; background: none; font-size: 12.5px; font-weight: 700; color: #6B7378; cursor: pointer\">← Volver al mostrador<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ esPreview }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background: #FDF3DC; border: 1px solid #F0DFB0; border-radius: 10px; padding: 12px 15px; font-size: 12.5px; font-weight: 600; color: #8A6A1F; line-height: 1.45\">Vista previa: esta nota todavía no se guarda. Vuelve a la captura y usa Guardar y ver ticket.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ waEnviado }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background: #E6F2F3; border: 1px solid #B9DBDE; border-radius: 10px; padding: 12px 15px; display: flex; flex-direction: column; gap: 9px\">\n              <span style=\"font-size: 12.5px; font-weight: 700; color: #0B6570\">WhatsApp abierto para {{ waDestino }}<\u002Fspan>\n              <sc-if value=\"{{ waBloqueado }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"font-size: 11.5px; color: #0B6570; line-height: 1.45\">El navegador bloqueó la ventana. Abre el chat con este botón:<\u002Fspan>\n              <\u002Fsc-if>\n              <a href=\"{{ waUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"display: block; text-align: center; height: 38px; line-height: 38px; border-radius: 8px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.06em; color: #fff; background: #0B6570; text-decoration: none\">ABRIR CHAT DE WHATSAPP<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ esClientes }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding: 24px 30px 40px; display: flex; flex-direction: column; gap: 16px\">\n\n        <sc-if value=\"{{ campanaPendiente }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background: #FFF7E6; border: 1px solid #F0D9A0; border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap\">\n            <span style=\"font-size: 13px; font-weight: 700; color: #7A5C15\">{{ campanaResumenTxt }}<\u002Fspan>\n            <div style=\"display: flex; gap: 8px\">\n              <button sc-camel-on-click=\"{{ reanudarCampana }}\" style=\"height: 34px; padding: 0 14px; border: none; border-radius: 7px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em; color: #fff; cursor: pointer; background: {{ accent }}\">REANUDAR<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ cancelarCampana }}\" style=\"height: 34px; padding: 0 14px; border: 1px solid #DCE1E4; background: #fff; border-radius: 7px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em; color: #A9403A; cursor: pointer\">CANCELAR<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mostrarDirectorio }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 16px\">\n\n        <div style=\"background: #fff; border: 1px solid #DCE1E4; border-radius: 12px; padding: 16px 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap\">\n          <div style=\"display: flex; flex-direction: column; gap: 3px\">\n            <span title=\"{{ tipClientesDirectorio }}\" style=\"font-size: 16px; font-weight: 800\">Directorio de clientes<\u002Fspan>\n            <span style=\"font-size: 12px; color: #6B7378\">{{ notaDirectorio }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap\">\n            <button sc-camel-on-click=\"{{ toggleAlta }}\" title=\"{{ tipClientesAlta }}\" style=\"height: 40px; padding: 0 16px; border: none; border-radius: 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #fff; cursor: pointer; background: {{ accent }}\">{{ altaLabel }}<\u002Fbutton>\n            <span style=\"font-size: 15px\">{{ iconoCandado }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ descargarClientes }}\" disabled=\"{{ bloqueado }}\" style=\"{{ descargaBtnStyle }}\">DESCARGAR CLIENTES<\u002Fbutton>\n            <label style=\"{{ cargaLabelStyle }}\">CARGAR CLIENTES\n              <input type=\"file\" accept=\"application/json,text/csv,.csv,.json\" sc-camel-on-change=\"{{ cargarClientes }}\" disabled=\"{{ bloqueado }}\" style=\"display: none\">\n            <\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background: #fff; border: 1px solid #DCE1E4; border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap\">\n          <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap\">\n            <button sc-camel-on-click=\"{{ seleccionarTodosCampana }}\" style=\"height: 36px; padding: 0 14px; border: 1px solid #DCE1E4; background: #fff; border-radius: 8px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em; color: #4A5257; cursor: pointer\">SELECCIONAR TODOS<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ quitarSeleccionCampana }}\" style=\"height: 36px; padding: 0 14px; border: 1px solid #DCE1E4; background: #fff; border-radius: 8px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em; color: #4A5257; cursor: pointer\">QUITAR SELECCIÓN<\u002Fbutton>\n            <span style=\"font-size: 12.5px; font-weight: 700; color: #6B7378\">{{ contadorSelTxt }}<\u002Fspan>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ abrirCampana }}\" disabled=\"{{ sinSeleccionCampana }}\" style=\"height: 38px; padding: 0 16px; border: none; border-radius: 8px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em; color: #fff; cursor: pointer; background: {{ accent }}; opacity: {{ sinSeleccionCampana ? 0.45 : 1 }}\">ENVIAR MENSAJE<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"{{ altaStyle }}\">\n          <span style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: {{ accent }}\">ALTA DE CLIENTE<\u002Fspan>\n          <div style=\"{{ altaCamposStyle }}\">\n            <label style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n              <span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.12em; color: #6B7378\">NOMBRE<\u002Fspan>\n              <input value=\"{{ ncNombre }}\" sc-camel-on-change=\"{{ setNcNombre }}\" style=\"{{ altaInputStyle }} font-weight: 600; text-transform: uppercase\">\n            <\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n              <span style=\"font-size: 9px; font-weight: 800; letter-spacing: 0.12em; color: #6B7378\">TELÉFONO<\u002Fspan>\n              <input value=\"{{ ncTel }}\" sc-camel-on-change=\"{{ setNcTel }}\" style=\"{{ altaInputStyle }} font-family: ui-monospace, 'SF Mono', Consolas, monospace\">\n ', Consolas, monospace; font-size: 13px; font-weight: 700\">{{ c.gastoTxt }}<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <button sc-camel-on-click=\"{{ c.togglePromo }}\" style=\"{{ c.promoBtnStyle }}\">{{ c.promoTxt }}<\u002Fbutton>\n                <span style=\"font-size: 10px; color: #8A9297\">{{ c.ultimoEnvioTxt }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 5px; flex-wrap: wrap\">\n                <button sc-camel-on-click=\"{{ c.usar }}\" style=\"height: 30px; padding: 0 8px; border: none; border-radius: 6px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.02em; color: #fff; cursor: pointer; background: {{ accent }}; white-space: nowrap\">NUEVA NOTA<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ c.editar }}\" title=\"Corregir datos\" style=\"height: 30px; padding: 0 8px; border: 1px solid #DCE1E4; border-radius: 6px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.02em; color: #4A5257; background: #fff; cursor: pointer; white-space: nowrap\">EDITAR<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ c.borrar }}\" disabled=\"{{ c.borrarDisabled }}\" title=\"{{ c.borrarTitle }}\" style=\"height: 30px; padding: 0 8px; border: 1px solid #DCE1E4; border-radius: 6px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.02em; color: #A9403A; background: #fff; cursor: pointer; white-space: nowrap\">BORRAR<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ sinClientes }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding: 40px 20px; text-align: center; font-size: 13px; color: #6B7378\">{{ vacioClientes }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ pasoEscribir }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background: #fff; border: Fspan>\n              <span style=\"{{ rolChipStyle }}\">{{ userRole }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size: 12px; color: #6B7378; line-height: 1.5\">Una línea por servicio: <b>CLAVE | Servicio | Precio<\u002Fb>. La clave y el precio se usan solos en la captura y en el ticket.<\u002Fspan>\n            <textarea value=\"{{ catTexto }}\" sc-camel-on-change=\"{{ setCatTexto }}\" disabled=\"{{ noEdita }}\" style=\"min-height: 380px; border: 1px solid #DCE1E4; border-radius: 8px; padding: 12px; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 12.5px; line-height: 1.6; outline: none; resize: vertical; background: #FBFCFC\"><\u002Ftextarea>\n            <sc-if value=\"{{ puedeEditar }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display: flex; gap: 8px; align-items: center\">\n                <button sc-camel-on-click=\"{{ guardarCatalogo }}\" style=\"height: 42px; padding: 0 18px; border: none; border-radius: 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #fff; cursor: pointer; background: {{ accent }}\">GUARDAR PRECIOS<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ restaurarCatalogo }}\" style=\"height: 42px; padding: 0 18px; border: 1px solid #DCE1E4; background: #fff; border-radius: 8px; font-size: 12px; font-weight: 700; color: #4A5257; cursor: pointer\">Restaurar lista original<\u002Fbutton>\n                <span style=\"font-size: 12px; color: #6B7378; font-weight: 600\">{{ catEstado }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ bloqueado }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"background: #FBEEEC; border: 1px solid #F0D2CD; border-radius: 8px; padding: 12px 14px; display: flex; align-items: center; gap: 12px\">\n                <span style=\"font-size: 16px\">🔒<\u002Fspan>\n                <span style=\"font-size: 12.5px; font-weight: 600; color: #7A2B26; flex: 1
